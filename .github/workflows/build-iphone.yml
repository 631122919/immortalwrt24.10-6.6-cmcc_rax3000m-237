name: Build OpenWrt (USB drivers)

on:
  workflow_dispatch:
  push:
    branches:
      - openwrt-24.10-6.6

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  REPO_COMMIT: f4d54cd2f657a4ba07777b615fe7650002dce7c2
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2004)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt && git checkout $REPO_COMMIT
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Run DIY part 1
      run: |
        chmod +x diy-part1.sh
        cd /workdir/openwrt
        $GITHUB_WORKSPACE/diy-part1.sh

    - name: Update and install feeds
      run: |
        cd /workdir/openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Run DIY part 2
      run: |
        chmod +x diy-part2.sh
        cd /workdir/openwrt
        $GITHUB_WORKSPACE/diy-part2.sh

    - name: Load configuration
      run: |
        cp $GITHUB_WORKSPACE/.config /workdir/openwrt/.config
        echo "CONFIG_PACKAGE_kmod-usb-net=y" >> /workdir/openwrt/.config
        echo "CONFIG_PACKAGE_kmod-usb-net-ipheth=y" >> /workdir/openwrt/.config
        echo "CONFIG_PACKAGE_kmod-usb-net-rndis=y" >> /workdir/openwrt/.config
        echo "CONFIG_PACKAGE_usbmuxd=y" >> /workdir/openwrt/.config
        echo "CONFIG_PACKAGE_libimobiledevice=y" >> /workdir/openwrt/.config
        echo "CONFIG_PACKAGE_usbutils=y" >> /workdir/openwrt/.config
        cd /workdir/openwrt && make defconfig

    - name: Download packages
      run: |
        cd /workdir/openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile firmware and packages
      id: compile
      run: |
        cd /workdir/openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload bin (firmware + all matching ipk)
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success'
      with:
        name: openwrt-bin-with-ipk
        path: /workdir/openwrt/bin
        compression-level: 6
